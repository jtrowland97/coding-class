<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Was That Movie Again?</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Tailwind (Play CDN). For production, swap this for a built stylesheet. -->
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          leader: "#e7eae8",
          paper: "#f5f7f6",
          ink: "#1c2530",
          soft: "#55616d",
          curtain: "#a8232c",
          steel: "#3a5a6a",
          line: "#c5ccd0",
        },
        fontFamily: {
          serif: ['"Instrument Serif"', '"Iowan Old Style"', "Georgia", "serif"],
          sans: ['"Hanken Grotesk"', "system-ui", "-apple-system", '"Segoe UI"', "sans-serif"],
        },
        keyframes: {
          roll: {
            from: { opacity: "0", transform: "translateY(12px)" },
            to: { opacity: "1", transform: "none" },
          },
          shimmer: { to: { backgroundPosition: "-200% 0" } },
        },
        animation: {
          roll: "roll .45s ease-out both",
          shimmer: "shimmer 1.2s linear infinite",
        },
      },
    },
  };
</script>
<style type="text/tailwindcss">
  @layer base {
    :focus-visible { @apply outline outline-[3px] outline-offset-2 outline-curtain; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  }
</style>
</head>

<body class="bg-leader font-sans leading-relaxed text-ink antialiased">
  <div class="mx-auto max-w-6xl px-5 pb-16 pt-6">

    <header class="flex flex-wrap items-end justify-between gap-x-8 gap-y-4 border-b-2 border-ink pb-5">
      <h1 class="font-serif text-[clamp(2.6rem,7vw,4.5rem)] font-normal leading-[0.95] tracking-tight">
        What Was That <em class="text-curtain">Movie Again?</em>
      </h1>
    </header>

    <form id="searchForm" role="search" class="mb-2 mt-7 grid grid-cols-2 gap-3 sm:grid-cols-[1fr_9rem_7rem_auto]">
      <input name="q" type="search" required placeholder="Search for a film, e.g. Arrival" aria-label="Film title"
             class="col-span-2 min-w-0 rounded border border-line bg-paper px-3 py-2.5 text-lg sm:col-span-1">
      <select name="type" aria-label="Type" class="min-w-0 rounded border border-line bg-paper px-3 py-2.5">
        <option value="movie">Movies</option>
        <option value="series">Series</option>
        <option value="episode">Episodes</option>
        <option value="">Any type</option>
      </select>
      <input name="y" type="text" inputmode="numeric" pattern="\d{4}" maxlength="4" placeholder="Year" aria-label="Year (optional)"
             class="min-w-0 rounded border border-line bg-paper px-3 py-2.5">
      <button type="submit"
              class="col-span-2 rounded border border-ink bg-ink px-5 py-2.5 font-medium text-paper hover:border-curtain hover:bg-curtain hover:text-white sm:col-span-1">
        Search
      </button>
    </form>

    <p id="status" role="status" aria-live="polite" class="mb-4 mt-2 min-h-[1.6rem] text-soft">
      Enter a title to find its cast and crew.
    </p>

    <section id="results" aria-label="Search results" hidden>
      <div id="resultGrid" class="grid grid-cols-[repeat(auto-fill,minmax(9.5rem,1fr))] gap-x-4 gap-y-5"></div>

      <div id="pager" hidden class="mt-6 flex items-center gap-4">
        <button type="button" id="prev"
                class="rounded border border-ink bg-transparent px-4 py-2.5 font-medium text-ink enabled:hover:border-curtain enabled:hover:bg-curtain enabled:hover:text-white disabled:cursor-not-allowed disabled:opacity-40">
          Previous
        </button>
        <span id="pageInfo" class="text-sm text-soft"></span>
        <button type="button" id="next"
                class="rounded border border-ink bg-transparent px-4 py-2.5 font-medium text-ink enabled:hover:border-curtain enabled:hover:bg-curtain enabled:hover:text-white disabled:cursor-not-allowed disabled:opacity-40">
          Next
        </button>
      </div>
    </section>

    <section id="detail" aria-label="Film credits" hidden class="mt-10 scroll-mt-4"></section>
  </div>

  <script src="app.js"></script>
</body>
</html>
